x-templates:
  volumes: &volumes
    volumes:
      - "caches:/root/caches-named-volume"
      - "./data/caches:/root/caches-bind-mount"
      - "playgrounds:/root/playgrounds-named-volume"
      - "./data/playgrounds:/root/playgrounds-bind-mount"
      - "./data/playbooks:/root/playbooks"
services:
  conflict-playground:
    build: .
    image: conflict-playground:playground
    container_name: conflict-playground
    <<: *volumes
volumes:
  caches:
  playgrounds: