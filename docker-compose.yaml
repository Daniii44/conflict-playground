services:
  conflict-playground:
    build: .
    image: conflict-playground
    container_name: conflict-playground
    restart: no
    tty: true
    stdin_open: true
    user: conflict-playground
    volumes:
      - "caches:/home/conflict-playground/caches-named-volume"
      - "./data/caches:/home/conflict-playground/caches-bind-mount"
      - "./data/playbooks:/home/conflict-playground/playbooks"
      - "playgrounds:/home/conflict-playground/playgrounds-named-volume"
      - "./data/playgrounds:/home/conflict-playground/playgrounds-bind-mount"
volumes:
  caches:
  playgrounds: