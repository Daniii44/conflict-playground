      limit: 100
    - repo_url: https://github.com/rust-lang/rust
      limit: 100
    - repo_url: https://github.com/openssl/openssl
      limit: 100
    - repo_url: https://github.com/Akaflieg-Freiburg/enroute
      limit: 100
    - repo_url: https://github.com/denoland/deno
      limit: 100
    - repo_url: https://github.com/Significant-Gravitas/AutoGPT.git
      limit: 100