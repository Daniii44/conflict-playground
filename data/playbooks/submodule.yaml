playbook:
  config:
    conflict-type-percentages:
      CONFLICT (submodule with possible resolution): 40
      CONFLICT (submodule may have rewinds): 40
      CONFLICT (submodule): 20
  sources:
    - repo_url: https://github.com/freeCodeCamp/freeCodeCamp.git
      limit: 100
